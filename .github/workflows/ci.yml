name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Qt system libraries (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"
      - name: Record versions
        run: pip freeze
      - name: Lint
        run: ruff check src tests
      - name: Unit and integration tests (offline, CPU; no EMsoft/CUDA/real data)
        run: pytest -q
      - name: Headless CPU demo (load -> project -> match -> export)
        run: |
          kwb demo --jobs ci_jobs --rows 4 --cols 4 --resolution 5 --quiet
          kwb demo --two-phase --jobs ci_jobs --rows 4 --cols 4 --resolution 5 --quiet
      - name: Upload demo outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-${{ matrix.os }}-py${{ matrix.python }}
          path: ci_jobs/*/outputs
          if-no-files-found: ignore
